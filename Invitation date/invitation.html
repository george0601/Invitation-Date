<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Would You Go Out With Me?</title>
    <style>
      :root {
        --bg: #fff7f3;
        --card: rgba(255, 255, 255, 0.8);
        --text: #2b1b1f;
        --muted: #6f5a5d;
        --pink: #f26c8e;
        --pink-dark: #d94d75;
        --peach: #ffd9c7;
        --rose: #ffc7d6;
        --line: rgba(69, 40, 47, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, #fff8f7 0%, #fff1ef 20%, #ffe5e6 45%, #fffaf7 100%);
        color: var(--text);
      }

      .app {
        width: min(760px, 92vw);
        min-height: 620px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 25px 70px rgba(115, 72, 83, 0.12);
        backdrop-filter: blur(2px);
        overflow: hidden;
        position: relative;
      }

      .home {
        min-height: 620px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px 30px;
      }

      .card {
        width: min(520px, 100%);
        text-align: center;
      }

      .emoji {
        font-size: 3rem;
        margin-bottom: 10px;
        animation: float 2.4s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3.1rem);
        line-height: 1.15;
        letter-spacing: -0.05em;
      }

      .subtext {
        margin: 16px auto 28px;
        font-size: 1rem;
        color: var(--muted);
        max-width: 450px;
        line-height: 1.6;
      }

      .choices {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 120px;
        margin-top: 18px;
      }

      .btn {
        border: none;
        border-radius: 16px;
        min-width: 130px;
        height: 58px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .yes-btn {
        background: linear-gradient(135deg, #f9a7b8, #f66c8d);
        color: white;
        box-shadow: 0 12px 25px rgba(242, 108, 142, 0.25);
      }

      .yes-btn.final-yes {
        transform: scale(1.06);
        box-shadow: 0 18px 35px rgba(242, 108, 142, 0.35);
      }

      .no-btn {
        background: #f9f0f3;
        color: var(--text);
        border: 1px solid rgba(42, 26, 31, 0.08);
        position: relative;
        transition: left 0.3s ease, top 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      }

      .no-btn:disabled {
        opacity: 0.9;
        cursor: not-allowed;
      }

      .crying-zone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .crying-zone.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .crying-sticker {
        font-size: 2rem;
        animation: wobble 0.7s ease-in-out;
      }

      .options-panel {
        display: none;
        min-height: 620px;
        padding: 36px 26px 26px;
      }

      .options-panel.visible {
        display: block;
      }

      .options-header {
        text-align: center;
        margin-bottom: 24px;
      }

      .options-header h2 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
        letter-spacing: -0.05em;
      }

      .options-header p {
        margin: 0;
        color: var(--muted);
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(200px, 1fr));
        gap: 18px;
      }

      .option-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,244,246,0.9));
        padding: 20px 18px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        position: relative;
        overflow: hidden;
      }

      .option-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 30px rgba(113, 74, 86, 0.08);
        border-color: rgba(242, 108, 142, 0.35);
      }

      .burst {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }

      .burst-heart {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 1.3rem;
        opacity: 0;
        animation: heartBurst 0.8s ease-out forwards;
      }

      @keyframes heartBurst {
        0% {
          transform: translate(-50%, -50%) scale(0.5);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.4);
          opacity: 0;
        }
      }

      .option-emoji {
        font-size: 2.2rem;
        margin-bottom: 10px;
      }

      .option-card h3 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }

      .option-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .confirmation {
        display: none;
        text-align: center;
        padding-top: 18px;
      }

      .confirmation.visible {
        display: block;
      }

      .confirmation h3 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 2vw, 2.1rem);
      }

      .confirmation p {
        margin: 0;
        color: var(--muted);
      }

      .music-line {
        margin-top: 10px !important;
        color: #8a4d5d !important;
        font-weight: 700;
      }

      .form-box {
        margin-top: 24px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
        text-align: left;
      }

      .form-box h3 {
        margin: 0 0 16px;
        font-size: 1.5rem;
      }

      .romantic-note {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 214, 226, 0.45);
        border: 1px solid rgba(242, 108, 142, 0.18);
        color: #7a4656;
        font-size: 0.96rem;
        font-weight: 600;
        line-height: 1.5;
        text-align: center;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .field label {
        font-weight: 600;
        color: var(--text);
      }

      .field-note {
        margin-top: -6px;
        font-size: 0.82rem;
        color: #8a4d5d;
        font-weight: 600;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid rgba(43, 27, 31, 0.12);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
      }

      .field textarea {
        min-height: 110px;
        resize: vertical;
      }

      .submit-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #f9a7b8, #f66c8d);
        color: white;
        height: 54px;
        font-size: 1.02rem;
        font-weight: 700;
        cursor: pointer;
      }

      .heart-rain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .heart {
        position: absolute;
        top: -20px;
        font-size: 20px;
        opacity: 0.9;
        animation: fall linear forwards;
      }

      .floating-hearts {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .floating-heart {
        position: absolute;
        font-size: 1.4rem;
        opacity: 0.7;
        animation: floatUp var(--duration) ease-in infinite;
        animation-delay: var(--delay);
        left: var(--left);
        top: 100%;
      }

      @keyframes floatUp {
        0% {
          transform: translate3d(0, 0, 0) scale(0.8) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.8;
        }
        100% {
          transform: translate3d(var(--drift), -110vh, 0) scale(1.2) rotate(18deg);
          opacity: 0;
        }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes wobble {
        0% { transform: scale(0.8) rotate(-8deg); }
        30% { transform: scale(1.1) rotate(8deg); }
        60% { transform: scale(0.95) rotate(-6deg); }
        100% { transform: scale(1) rotate(0); }
      }

      @keyframes fall {
        0% {
          transform: translate3d(0, 0, 0) scale(0.8) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--drift), 100vh, 0) scale(1.2) rotate(25deg);
          opacity: 0;
        }
      }

      @media (max-width: 600px) {
        .options-panel {
          padding: 28px 18px 22px;
        }

        .option-grid {
          grid-template-columns: 1fr;
        }

        .choices {
          gap: 12px;
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="heart-rain" id="heartRain" aria-hidden="true"></div>
      <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

      <section class="home" id="homeSection">
        <div class="card">
          <div class="emoji">💌</div>
          <h1>Would you go on a date with me next month?</h1>

          <div class="choices">
            <button class="btn yes-btn" id="yesBtn" type="button">YES</button>
            <button class="btn no-btn" id="noBtn" type="button">NO</button>
            <div class="crying-zone" id="cryingZone" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section class="options-panel" id="optionsPanel" aria-live="polite">
        <div class="options-header">
          <h2>Perfect! Where would you like to go?</h2>
          <p>Pick one and we’ll make it happen.</p>
        </div>

        <div class="option-grid">
          <button class="option-card" type="button" data-choice="Hiking">
            <div class="option-emoji">🥾</div>
            <h3>Hiking</h3>
            <p>A scenic walk and a calm little adventure.</p>
          </button>

          <button class="option-card" type="button" data-choice="Movie Date">
            <div class="option-emoji">🎬</div>
            <h3>Movie Date</h3>
            <p>Cozy, relaxed, and perfect for a sweet evening.</p>
          </button>

          <button class="option-card" type="button" data-choice="Foodtrip">
            <div class="option-emoji">🍜</div>
            <h3>Foodtrip</h3>
            <p>Eat, laugh, and enjoy a good food adventure.</p>
          </button>

          <button class="option-card" type="button" data-choice="Art & Gallery">
            <div class="option-emoji">🎨</div>
            <h3>Art & Gallery</h3>
            <p>A creative outing with art, colors, and vibes.</p>
          </button>

          <button class="option-card" type="button" data-choice="I’ll choose for us">
            <div class="option-emoji"></div>
            <h3>I’ll choose</h3>
            <p>If you can’t decide yet, I’ll choose the perfect plan for us.</p>
          </button>
        </div>

        <div class="confirmation" id="confirmationBox">
          <h3>Yay! I’m excited for our <span id="chosenValue">date</span>.</h3>
          <p id="confirmationMessage">Let’s make it special together.</p>
          <p class="music-line">Now playing: <strong>Daylight</strong> by Taylor Swift.</p>
        </div>

        <div class="form-box" id="dateFormBox">
          <h3>Tell me your preferred plan</h3>

          <form id="dateForm">
            <div class="field">
              <label for="dateInput">Preferred date</label>
              <input id="dateInput" type="date" required />
            </div>

            <div class="field" id="locationField">
              <label for="locationInput">Preferred location</label>
              <input id="locationInput" type="text" placeholder="Example: Green Park, Mall, Cafe, Art Museum" required />
            </div>

            <div class="field-note" id="locationNote" hidden>
              I’ll choose the perfect location for us 💕
            </div>

            <div class="field">
              <label for="messageInput">Message</label>
              <textarea id="messageInput" placeholder="I’d love to..."></textarea>
            </div>

            <button class="submit-btn" type="submit">Confirm my date</button>
          </form>
        </div>
      </section>
    </div>

    <script>
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const homeSection = document.getElementById('homeSection');
      const optionsPanel = document.getElementById('optionsPanel');
      const cryingZone = document.getElementById('cryingZone');
      const confirmationBox = document.getElementById('confirmationBox');
      const chosenValue = document.getElementById('chosenValue');
      const confirmationMessage = document.getElementById('confirmationMessage');
      const locationField = document.getElementById('locationField');
      const locationNote = document.getElementById('locationNote');
      const locationInput = document.getElementById('locationInput');
      const messageInput = document.getElementById('messageInput');
      let noClicked = 0;
      const cryingEmojis = ['😭', '😢', '😿', '💔', '🫠', '😩', '🥺', '😓', '😣', '😭'];

      function startHeartRain() {
        const rain = document.getElementById('heartRain');
        const hearts = ['💗', '💖', '💞', '💕', '💘'];

        for (let i = 0; i < 26; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = hearts[i % hearts.length];
          heart.style.left = `${Math.random() * 100}%`;
          heart.style.animationDuration = `${4 + Math.random() * 4}s`;
          heart.style.animationDelay = `${Math.random() * 0.8}s`;
          heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
          rain.appendChild(heart);
        }

        setTimeout(() => {
          rain.innerHTML = '';
        }, 7000);
      }

      function createFloatingHearts() {
        const container = document.getElementById('floatingHearts');
        const symbols = ['💖', '💗', '💕', '💘', '💞'];

        for (let i = 0; i < 18; i++) {
          const heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = symbols[i % symbols.length];
          heart.style.setProperty('--left', `${Math.random() * 100}%`);
          heart.style.setProperty('--delay', `${(Math.random() * 5).toFixed(2)}s`);
          heart.style.setProperty('--duration', `${6 + Math.random() * 7}s`);
          heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 190}px`);
          container.appendChild(heart);
        }

        setTimeout(() => {
          container.innerHTML = '';
        }, 12000);
      }

      yesBtn.addEventListener('click', () => {
        startHeartRain();
        createFloatingHearts();
        homeSection.style.display = 'none';
        optionsPanel.classList.add('visible');
      });

      noBtn.addEventListener('click', () => {
        noClicked += 1;

        if (noClicked >= 11) {
          noBtn.style.opacity = '0';
          noBtn.style.pointerEvents = 'none';
          noBtn.style.transform = 'translateX(200px)';
          yesBtn.classList.add('final-yes');
          yesBtn.style.transform = 'translateX(-18px) scale(1.08)';
          yesBtn.style.zIndex = '3';

          const finalText = document.createElement('div');
          finalText.textContent = 'Okay… I guess I owe you a smile 😄';
          finalText.style.marginTop = '18px';
          finalText.style.fontWeight = '700';
          finalText.style.color = '#8a4d5d';
          cryingZone.innerHTML = '';
          cryingZone.appendChild(finalText);
          cryingZone.classList.add('visible');
          return;
        }

        const app = document.querySelector('.app');
        const maxX = Math.max(40, app.clientWidth - 220);
        const maxY = Math.max(40, app.clientHeight - 180);
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.position = 'absolute';
        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;
        noBtn.style.transform = 'scale(1.06)';
        noBtn.disabled = true;
        noBtn.style.pointerEvents = 'none';
        yesBtn.style.pointerEvents = 'auto';
        yesBtn.style.opacity = '1';

        const cryingSticker = document.createElement('span');
        cryingSticker.className = 'crying-sticker';
        cryingSticker.textContent = cryingEmojis[(noClicked - 1) % cryingEmojis.length];
        cryingZone.innerHTML = '';
        cryingZone.appendChild(cryingSticker);
        cryingZone.classList.add('visible');

        setTimeout(() => {
          cryingSticker.style.opacity = '0';
          cryingSticker.style.transform = 'translateY(12px)';
        }, 900);

        setTimeout(() => {
          noBtn.disabled = false;
          noBtn.style.pointerEvents = 'auto';
          noBtn.style.position = 'relative';
          noBtn.style.left = '0';
          noBtn.style.top = '0';
          noBtn.style.transform = 'scale(1)';
        }, 500);
      });

      async function sendChoiceToEmail(selected, date, location, message) {
        const safeMessage = message && message.trim() ? message : 'No message added';
        const emailBody = `She selected: ${selected}\nPreferred date: ${date}\nPreferred location: ${location}\nSoundtrack: Daylight by Taylor Swift\nMessage: ${safeMessage}`;

        const payload = {
          name: 'Date Confirmation',
          email: 'benoyogeorge97@gmail.com',
          message: emailBody
        };

        try {
          const response = await fetch('https://formsubmit.co/ajax/benoyogeorge97@gmail.com', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('Email sending failed');
          }

          return true;
        } catch (error) {
          console.error('FormSubmit failed:', error);
          window.location.href = `mailto:benoyogeorge97@gmail.com?subject=${encodeURIComponent('Date confirmation')}&body=${encodeURIComponent(emailBody)}`;
          return false;
        }
      }

      function triggerHeartBurst(card) {
        const burst = document.createElement('div');
        burst.className = 'burst';

        const hearts = ['💖', '💗', '💕', '💘', '💞'];

        for (let i = 0; i < 9; i++) {
          const heart = document.createElement('span');
          heart.className = 'burst-heart';
          heart.textContent = hearts[i % hearts.length];
          heart.style.setProperty('--x', `${(Math.random() - 0.5) * 140}px`);
          heart.style.setProperty('--y', `${(Math.random() - 0.5) * 140}px`);
          heart.style.left = '50%';
          heart.style.top = '50%';
          burst.appendChild(heart);
        }

        card.appendChild(burst);
        setTimeout(() => burst.remove(), 850);
      }

      document.querySelectorAll('.option-card').forEach((card) => {
        card.addEventListener('click', async () => {
          triggerHeartBurst(card);

          const selected = card.dataset.choice;
          chosenValue.textContent = selected;
          confirmationMessage.textContent = `Our ${selected} plan is officially my favorite choice.`;
          confirmationBox.classList.add('visible');
          document.querySelectorAll('.option-card').forEach((btn) => {
            btn.disabled = true;
            btn.style.opacity = '0.9';
          });

          if (selected === 'I’ll choose for us') {
            locationField.style.display = 'none';
            locationNote.hidden = false;
            locationInput.required = false;
            locationInput.value = 'I will choose the location';
            messageInput.placeholder = 'Let me send you a message of my choice';
            messageInput.value = 'Let me send you a message of my choice';
            messageInput.setAttribute('aria-label', 'Let me send you a message of my choice');
          } else {
            locationField.style.display = 'flex';
            locationNote.hidden = true;
            locationInput.required = true;
            locationInput.value = '';
            messageInput.placeholder = 'I’d love to...';
            messageInput.value = '';
            messageInput.removeAttribute('aria-label');
          }

          const form = document.getElementById('dateForm');
          form.dataset.selected = selected;
        });
      });

      document.getElementById('dateForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const form = event.currentTarget;
        const selected = form.dataset.selected || 'Selected plan';
        const date = document.getElementById('dateInput').value;
        const location = document.getElementById('locationInput').value;
        const message = document.getElementById('messageInput').value || '';

        await sendChoiceToEmail(selected, date, location, message);

        const params = new URLSearchParams({
          selected,
          date,
          location,
          message
        });

        window.location.href = `confirmation.html?${params.toString()}`;
      });
    </script>
  </body>
</html>
